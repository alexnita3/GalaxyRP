//------------GALAXY RP Admin Settings------------

// the default superadmin account is created on the first server launch with "admin" as username and password
// remember to change its password to something else!

// new accounts are created with these admin permissions (bit value)
set rp_default_account_permissions "0"

//------------Lua Scripts------------

// server-side Lua scripts: quests, jobs, world events and the like. lua/lua_api.md explains how to write them
// 0 = no Lua at all (from the next map, or right away with /scripts reload all)
set rp_lua "1"

// plugins to run: the names of folders in lua/plugins, separated by spaces (none by default)
// /scripts enable and disable change this only until the server restarts
set rp_lua_plugins ""

// 1 = also run the scripts in lua/maps/<map name>/ on that map
set rp_lua_mapscripts "0"

// limits that keep a broken or slow script from hurting the server
set rp_lua_memmb "64" // memory for all scripts together, in MB
set rp_lua_budget "1000000" // instructions one script call may run
set rp_lua_budgetms "50" // milliseconds one script call may run
set rp_lua_framems "15" // milliseconds of timers and tasks per server frame; the rest wait for the next frame
set rp_lua_maxerrors "20" // a plugin with this many errors in a minute is switched off
set rp_lua_maxvalue "65536" // largest value a script may store, in bytes
set rp_lua_maxstore "2097152" // most a plugin may store in lua.db, in bytes
set rp_lua_maxents "32" // entities and zones one plugin may have at once
set rp_lua_spawnkb "512" // game memory, in KB, all scripts' spawns may use per map (it is freed when the map changes)
set rp_lua_newfx "8" // new effect files scripts may add per map (a map has only 64 effect slots)
set rp_lua_maxnpcs "8" // NPCs one plugin may have at once, corpses included (they count as entities too)

// items scripts may give players: item class names separated by spaces, e.g. "weapon_blaster ammo_blaster item_medpac"
// empty = scripts give nothing
set rp_lua_items ""

// the most credits and the most XP one script call may give or take (more is cut to this, with a warning in the log)
// 0 = scripts cannot pay or charge credits / give XP at all. Every payment is written to the server log
set rp_lua_maxcredits "5000"
set rp_lua_maxxp "10"

// 1 = allow the rcon command lua_exec, which runs a line of Lua typed in the server console
set rp_lua_allowexec "0"

//------------BOT and NPC Settings------------

set bot_enable "0" // 1 = allow bots
set bot_minPlayers "0" // add bots until this many players are in game, 0 = off
set g_allowNPC "1" // 1 = NPCs may be spawned
set g_npcspskill "1" // NPC difficulty: 0 = easy, 1 = medium, 2 = hard (highest; above 2 acts as 2). Sets NPC aim, reaction and rate of fire. Bots also read it as their skill (1-5).

//------------Disable Individual Pickups------------

set disable_item_force_enlighten_light "0"
set disable_item_force_enlighten_dark "0"
set disable_item_force_boon "0"
set disable_item_ysalimari "0"

// any pickup can be disabled the same way with set disable_<item> "1":
// Health, armor and holdables: item_shield_sm_instant, item_shield_lrg_instant, item_medpak_instant, item_seeker, item_shield, item_medpac, item_medpac_big, item_binoculars, item_sentry_gun, item_jetpack, item_healthdisp, item_ammodisp, item_eweb_holdable, item_cloak
// Force powerups: item_force_enlighten_light, item_force_enlighten_dark, item_force_boon, item_ysalimari
// Weapons: weapon_stun_baton, weapon_melee, weapon_saber, weapon_blaster_pistol, weapon_concussion_rifle, weapon_bryar_pistol, weapon_blaster, weapon_disruptor, weapon_bowcaster, weapon_repeater, weapon_demp2, weapon_flechette, weapon_rocket_launcher, weapon_thermal, weapon_trip_mine, weapon_det_pack, weapon_emplaced, weapon_turretwp
// Ammo: ammo_thermal, ammo_tripmine, ammo_detpack, ammo_force, ammo_blaster, ammo_powercell, ammo_metallic_bolts, ammo_rockets, ammo_all
// Team/CTF: team_CTF_redflag, team_CTF_blueflag, team_CTF_neutralflag, item_redcube, item_bluecube

//------------Vote Settings------------

set g_allowVote "976" // bit value, which votes players may call. -1 = all, 0 = none
set g_allowTeamVote "1" // 1 = allow team votes
set g_voteDelay "3000" // milliseconds between a passed vote and its execution

// 0 = do not change to a map that supports the new gametype after a gametype vote
set rp_change_map_gametype_vote "1"

// seconds before a player may call another vote, 0 = no wait
set rp_vote_timer "10"

//------------Map Settings------------

set g_autoMapCycle "0" // 1 = cycle through every map automatically, 0 = use the rotation below

set galaxyrp_1 "map mp/ffa5; set nextmap vstr galaxyrp_2"
set galaxyrp_2 "map mp/duel6; set nextmap vstr galaxyrp_1"
vstr galaxyrp_1
