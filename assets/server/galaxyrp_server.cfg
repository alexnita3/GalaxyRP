//
//                   [Important notes]:
// Most cvars use "1" to enable and "0" to disable
// Some take bit values, use galaxyrp_calculator.html to work them out
// Times are in seconds unless a description says milliseconds (1000 = 1 second)
// Visit https://github.com/praviilon/galaxy_ultimate for online documentation and info

//------------Server Clients and Passwords------------

set rconpassword "myrconpassword" // admin console (rcon) password
set sv_maxclients "32" // player slots on the server, maximum is 32
set g_maxGameClients "32" // players allowed to be in game (not spectating) at once, 0 = no limit
set g_password "" // password to connect
set g_needpass "0" // 1 = require g_password to connect
set sv_privatePassword "" // password for the private slots
set sv_privateClients "0" // number of slots reserved for sv_privatePassword

//------------Main Settings------------

//sets Hosted "SET_ME"
//sets Clan "SET_ME"
//sets WebSite "SET_ME"

// server name, shown in the server browser
set sv_hostname "^6Galaxy^4RP ^7Server"

// message on the loading screen
set g_motd "You have just arrived at RP server"

// welcome message shown on the screen after joining
set rp_screen_message "Welcome! Use ^3/list ^7in console to see the mod features. Enjoy!"

// how long the welcome message stays on the screen, in seconds
set rp_screen_message_timer "5"

set sv_keywords "word1 word2" // search keywords for the server browser
set sv_fps "40" // server frames per second (TaystJK default 40); clients pick their own /snaps
set sv_pure "0" // 1 = clients may only use the server's pk3s (blocks custom skins, hilts, etc.)
set sv_allowDownload "0" // 1 = clients may download missing files from the server (slow, use an http mirror instead)

// milliseconds between server commands from one client (1 = 1000). Raising this breaks the mod's client-side menus
set sv_floodProtect "150"

//------------Connection------------

set g_forceClientUpdateRate "150" // milliseconds a client may go without sending a move before the server forces one
set sv_minPing "0" // refuse players below this ping, 0 = off
set sv_maxPing "0" // refuse players above this ping, 0 = off
set g_banIPs "" // banned IPs, separated by spaces
set g_filterBan "1" // 1 = g_banIPs is a ban list, 0 = it is an allow list
set g_inactivity "0" // kick players idle for this many seconds, 0 = off
set g_timeouttospec "0" // move players idle for this many seconds to spectator, 0 = off
set sv_reconnectLimit "10" // seconds a client must wait before reconnecting, 0 = no limit
set sv_minRate "2000" // lowest bandwidth rate a client may use (bytes/second), 0 = no limit
set sv_maxRate "90000" // highest bandwidth rate a client may use (bytes/second), 0 = no limit
set sv_timeout "200" // seconds without packets before a client is dropped (engine default 200, never 0)
set sv_zombietime "5" // seconds a dropped client's slot is kept before reuse
set g_maxConnPerIP "3" // connections allowed from one IP address
set g_antiFakePlayer "1" // 1 = block fake-player (q3fill) connection attempts
set g_userinfoValidate "528482303" // bit value, which userinfo fields are checked for exploits (/toggleuserinfovalidation, see galaxyrp_calculator.html)
set g_log "logs/server.log" // game log file
set g_logSync "1" // 1 = write the game log without buffering (survives a crash)
set g_logClientInfo "1" // 1 = log client connects and userinfo changes
set g_securityLog "1" // 1 = log security events (bans, rcon, fake players) to logs/security.log, 2 = unbuffered

//------------Gametypes------------
// 0 = FFA (Free For All)
// 3 = DUEL
// 4 = POWER DUEL
// 6 = TEAM DEATHMATCH
// 7 = SIEGE
// 8 = CTF (Capture the Flag)

set g_gametype "0"

//------------Architectural settings------------

// plugin requirement. 1 = alert players without the client plugin, 2 = force them to spectator
set rp_pluginRequired "1"

// login requirement. 1 = force logged-out players to spectator
set rp_loginRequired "0"

// 1 = login, logout and character switching without a forced respawn, 0 = always force a respawn
set rp_seamlesslogin "1"

// GalaxyRP logical entity system, applies at the next map (do not disable unless you know what you are doing)
set rp_logical_entities "1"

//------------FFA settings and Environment------------

set g_warmup "0" // warmup length in seconds
set g_doWarmup "0" // 1 = run a warmup before the match
set g_forceRespawn "60" // force dead players to respawn after this many seconds, 0 = never
set g_spawnInvulnerability "1000" // milliseconds of invulnerability after spawning
set g_noSpecMove "0" // 1 = spectators cannot move
set g_gravity "800"
set g_speed "250"
set g_dismember "100" // chance of dismemberment on death, players must also set cg_dismember client-side
set rp_npc_corpse_time "10" // seconds an NPC corpse stays after its death animation, 0-200
set rp_limb_lifetime "8" // seconds a cut-off limb stays (random between this and double), 0-200
set rp_player_corpse_time "30" // seconds a player corpse stays before fading away, 0-200
set rp_item_lifetime "100" // seconds a dropped weapon or item stays on the ground before disappearing, 0-200
set dmflags "0" // bit value: 8 = no falling damage, 16 = fixed 80 FOV, 32 = no footstep sounds, 64 = no drowning (see galaxyrp_calculator.html)
set g_charRestrictRGB "0" // 1 = block very dark player skin colours, 0 = allow them
set g_knockback "1000" // scale of knockback from hits and force pushes

//------------Other gametypes------------

set g_siegeRespawn "20" // seconds between siege respawn waves
set g_siegeTeam1 "" // force a siege team, empty = map default
set g_siegeTeam2 ""
set g_siegeTeamSwitch "1" // 1 = swap siege teams after a round
set rp_scale_siege_damage "0.7" // scales all damage in the Siege gametype
set g_forceBasedTeams "0" // 1 = team decided by light/dark force side
set g_teamAutoJoin "0" // 1 = join a team automatically instead of spectating
set g_teamForceBalance "0" // 1 = refuse joining the team with more players
set g_friendlyFire "1" // 1 = weapons damage teammates
set g_friendlySaber "1" // 1 = sabers damage teammates

//------------Duel and Power Duel------------

set g_duelForcePowerDisable "163837" // bit value, force powers disabled in Duel and Power Duel gametypes
set g_duelWeaponDisable "1" // bit value, weapons disabled in Duel gametypes. Saber only 524279, Saber + Melee 524275
set g_powerDuelStartHealth "150" // health of the lone duelist in Power Duel at the start
set g_powerDuelEndHealth "90" // health the lone duelist drops towards as they win
set g_showDuelHealths "0" // 1 = show duelists' health to everyone
set g_allowHighPingDuelist "1" // 1 = players with 999 ping may duel
set g_slowmoDuelEnd "0" // 1 = slow motion when a Duel gametype round ends

//------------Private Duel------------

set g_privateDuel "1" // allow private duels
set rp_allow_force_duel "1" // allow Force private duels

// max distance one duelist can be from the other in a private duel
set rp_duel_radius "1024"

// saber damage scale in private duels
set rp_duel_saberDamageScale "1.0"

// force regeneration inside a private duel, one per kind of duel (lower = faster)
set g_saberDuelForceRegenTime "60"
set g_forceDuelForceRegenTime "60"

// 0 = no saber touch damage (damage from an idle saber) in private duels
set rp_allow_duel_saber_touch_damage "0"

// 1 = players in a private duel do not collide with other players. Applies at the next map
set rp_duel_no_collision "1"

// like g_saberDmgDelay_Idle, milliseconds between idle saber hits in private duels
set rp_duel_saberDmgDelay_Idle "350"

set g_allowDuelSuicide "1" // 1 = /kill is allowed during a private duel

//------------Weapon and Item Settings------------

set g_locationBasedDamage "1" // 1 = headshots and limb hits do different damage
set g_weaponDisable "0" // bit value, weapons removed from the map. Saber only 524279, Saber + Melee 524275
set g_adaptRespawn "0" // 1 = shorten item respawn times as more players join

// item respawn times, in seconds
set g_weaponRespawn "60"
set rp_ammo_respawn_time "60"
set rp_shield_respawn_time "60"
set rp_health_respawn_time "60"
set rp_holdable_item_respawn_time "60"
set rp_powerup_respawn_time "60"

// milliseconds between each flame fired by the flame thrower
set rp_flame_thrower_cooldown "50"

// flame thrower damage per flame
set rp_flame_thrower_damage "2"

//------------Saber Settings------------

set g_saberBladeFaces "1" // 1 = saber blade always faces the camera
set d_saberGhoul2Collision "1" // 1 = precise per-model saber collision
set d_saberInterpolate "0" // 1 = interpolate saber traces between frames (costs server CPU)
set g_saberDmgDelay_Wound "0" // milliseconds between saber hits on a target that was just hit
set d_saberAlwaysBoxTrace "0" // 1 = box traces for the saber even with ghoul2 collision on
set d_saberSPStyleDamage "1" // 1 = single player style saber damage, 0 = JK2 style
set d_saberKickTweak "1" // 1 = weaker staff kick (basejka), 0 = full kick damage
set g_saberLocking "1" // 1 = allow saber locks
set g_saberLockFactor "2" // how much a saber lock favours the attacker
set g_saberLockRandomNess "2" // randomness of saber lock outcomes
set g_saberTraceSaberFirst "1" // 1 = saber traces hit sabers before bodies
set g_saberRestrictForce "0" // 1 = no hand force powers while dual sabers or a staff are on
set g_saberDmgVelocityScale "0" // scales saber damage by swing speed, 0 = off

set g_saberDamageScale "1.0" // scales all saber damage
set g_saberWallDamageScale "1.0" // scales saber damage to breakable walls and objects

set g_saberDmgDelay_Idle "350" // milliseconds between idle saber hits

// 0 = no saber touch damage (damage from an idle saber)
set rp_allow_saber_touch_damage "1"

//------------Force Settings------------

set g_forcePowerDisable "0" // bit value, force powers disabled on the server
set g_maxForceRank "7" // 1-Initiate 2-Padawan 3-Jedi 4-Adept 5-Guardian 6-Knight 7-Master
set g_forceRegenTime "60" // milliseconds per force point regenerated (lower = faster)
set g_forceDodge "1" // 1 = players with Force Sight up may dodge disruptor shots, 2 = based on Force Speed; no other power may be active, 0 = off
set g_useWhileThrowing "1" // 1 = hand force powers can be used while the saber is thrown

//------------RP Mechanic Settings------------

// seconds people stay downed before being able to get up (30-100). 0 disables the downed system
set rp_downed_timer "30"

// seconds of invulnerability after getting up (up to 30). 0 disables this feature
set rp_downed_invulnerability_timer "10"

// 1 = passive healing from the shield and health regeneration skills. 0 = regeneration only while meditating
set rp_allow_passive_regen "0"

// 0 = no passive regeneration of ammo (powercells, blaster pack, metal bolts) for logged-in characters
set rp_allow_ammo_regen "1"

// seconds between each ammo regeneration tick. Ignored if the above is 0
set rp_ammo_regen_timer "5"

// 0 = no passive regeneration of explosives and rocket ammo for logged-in characters
set rp_allow_explosives_regen "1"

// seconds between each explosives regeneration tick. Ignored if the above is 0
set rp_explosives_recharge_timer "30"

// /jetpack command. 0 = disabled, 1 = logged-out players and logged-in skill holders, 2 = logged-in skill holders only
set rp_allow_jetpack_command "2"

// grapple hook. 0 = disabled, 1 = logged-out players and logged-in skill holders, 2 = logged-in skill holders only
set rp_allow_grapple_hook "2"

// grapple hook tuning
set g_allowGrapple "2" // 1 = swing (Tarzan style), 2 = winch (JA+ style)
set g_hookSpeed "2400" // speed the hook travels at
set g_hookInheritance "0.5" // share of the player's own speed the hook inherits when fired
set g_hookStrength "800" // winch reel speed / swing target speed
set g_hookStrength1 "20" // swing acceleration far from the anchor
set g_hookStrength2 "40" // swing acceleration near the anchor
set g_hookFloodProtect "600" // milliseconds between hook shots

// /emote and /anim commands. 0 = disabled, 1 = allowed, 2 = allowed except in private duels
set rp_allow_emotes "1"

// 1 = allow the /playsound command
set rp_allow_playsound_command "1"

// milliseconds between each use of the /buy command
set rp_buying_cooldown "100"

// milliseconds between each use of /roll, /rollall, /flipcoin and /flipcoinall, 0 = no cooldown
set rp_dice_roll_cooldown "3000"

// 1 = an upgraded stun baton can unlock doors
set rp_stun_baton_door_unlock "1"

// max credits a character can have. Minimum 1, default 500000
set rp_max_rpg_credits "5000000"

// character max level, allowed range 10-300 (default 100)
set rp_rpg_max_level "100"

// shield a logged-out player spawns with, allowed range 0-100
set rp_starting_shield "0"

//------------Additional Game Tweaks------------

// milliseconds a player must have the chat open before becoming immune to damage, checked once per second. 0 = off
set rp_chat_protection_timer "1"

// if > 0, milliseconds the server may be empty (no players) before going to the next map
set rp_server_empty_change_map_time "0"

// 1 = remove the SP story NPCs (bosses, droids, merchants, creatures) from SP maps
set rp_sp_npc_fix "0"

set g_armBreakage "0" // 1 = arms can be broken by heavy hits
set g_stepSlideFix "1" // 1 = fixed step/slide movement against edges
set g_randFix "1" // 1 = fixed random saber deflection (Windows and Linux behave the same)

//------------Mini-game Settings------------

// allow Duel Tournament and Melee Battle. Apply at the next map
set rp_allow_duel_tournament "1"
set rp_allow_melee_battle "1"

// milliseconds after the last player joins before a Duel Tournament starts
set rp_duel_tournament_time_to_start "12000"

// duration of one duel in a Duel Tournament, in milliseconds. Applies at the next map
set rp_duel_tournament_duel_time "180000"

// rounds per Duel Tournament match. Default 1
set rp_duel_tournament_rounds_per_match "1"

// minimum number of players for a Duel Tournament to start
set rp_duel_tournament_min_players "2"

// Duel Tournament arena size, in percent. Default 800. Applies at the next map
set rp_duel_tournament_arena_scale "800"

//------------Extra Weapon Tweaks------------

// scales the ammo a player gets from an ammo item or weapon pickup (allowed range 0.01 - 1.0; values outside it are snapped to the nearest end)
set rp_add_ammo_scale "0.5"

// max ammo limits
set rp_max_blaster_pack_ammo "600"
set rp_max_power_cell_ammo "600"
set rp_max_metal_bolt_ammo "600"
set rp_max_rocket_ammo "60"
set rp_max_thermal_ammo "18"
